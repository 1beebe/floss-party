<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floss-o'-Lantern</title>
<script>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Figtree:wght@500;700&display=swap">
<style>
  :root {
    --bg: #4A2D6B;
    --enamel: #FBF6EC;
    --ink: #262A27;
    --floss: #BFF2DC;
  }
  /* dark controls on the page itself only: inside the party's iframe a dark scheme
     would make the browser paint an opaque backdrop behind the transparent dance */
  html:not(.embed) { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Figtree", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    box-sizing: border-box;
  }
  .wrap { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; }
  svg.stage { width: 100%; max-width: 100%; aspect-ratio: 1 / 1; height: auto; display: block; overflow: visible; }
  .bar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 {
    font-family: "Creepster", "Lilita One", Impact, system-ui, sans-serif;
    font-weight: 400;
    font-size: clamp(28px, 6.5vw, 40px);
    margin: 0;
    color: #FFB22E;
    text-shadow: 2px 2px 0 var(--ink);
    letter-spacing: .04em;
  }
  .meta { font-size: 13px; color: var(--enamel); opacity: .8; margin: 4px 0 0; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: 700 13px/1 "Figtree", system-ui, sans-serif;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--enamel);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 9px 14px;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
  }
  button[aria-pressed="true"] { background: var(--floss); }
  button:active { transform: translate(2px, 2px); box-shadow: none; }
  button:focus-visible { outline: 3px solid var(--floss); outline-offset: 2px; }
  /* ?embed: drawn inside the app's party, so no page chrome or background */
  html.embed, html.embed body { background: transparent; }
  html.embed body { padding: 0; display: block; overflow: hidden; }
  html.embed .wrap { max-width: none; }
  html.embed .bar { display: none; }
  html.embed .scenery { display: none; }
  /* the party backdrop is dark, so bats get a soft enamel rim there */
  html.embed .bat { stroke: rgba(251,246,236,.75); stroke-width: 3px; stroke-linejoin: round; paint-order: stroke; }
</style>
</head>
<body>
<div class="wrap">
  <svg class="stage" id="stage" viewBox="-58 -60 520 520" role="img" aria-label="Halloween night in a pumpkin patch. A cartoon tooth in a witch hat jumps when three candy-corn sugar bugs hop out of a glowing jack-o'-lantern. It pulls out a strand of mint floss and does the floss dance, swinging the floss behind its back and between its roots, and hip-checks each sugar bug out of the patch. Bats cross the moon, the tooth leaps with its arms up, tips its hat, and two little eyes peek out of the pumpkin again."></svg>
  <div class="bar">
    <div>
      <h1>Floss-o'-Lantern</h1>
      <p class="meta">A witch hat, a pumpkin patch and three candy-corn sugar bugs. 10-second loop.</p>
    </div>
    <div class="controls">
      <button id="sound" type="button" aria-pressed="false">Sound</button>
      <button id="toggle" type="button">Pause</button>
      <button id="restart" type="button">Replay</button>
    </div>
  </div>
</div>
<script src="tooth-kit.js"></script>
<script>
(() => {
  const K = ToothKit, { seg, lerp, eIO, eIn, eOut, kf, bump, clamp, TAU, INK, ENAMEL } = K;
  const T = 10, GROUND = 334;
  const PUMPKIN = '#F28A2E', PUMPKIN_FAR = '#DB7420', GLOW = '#FFD23F', GLOW_HOT = '#FFF0A0';
  const POP = [1.45, 1.7, 1.95];                 // sugar bugs hop out of the jack-o'-lantern
  const HIT = [3.75, 4.75, 5.75];                 // hips-right beats of the floss dance
  const MOUTH = [392, 306], CONTACT = 340, BUG = 1.25;

  const witchHat = `
    <g transform="translate(202 92) rotate(-4)" stroke="${INK}" stroke-width="6" stroke-linejoin="round">
      <ellipse cx="0" cy="2" rx="100" ry="14" fill="#2F2440"/>
      <path fill="#2F2440" d="M-44 -2 L-10 -96 C-4 -112 14 -122 34 -114 C46 -108 54 -100 58 -88 C44 -98 30 -96 23 -84 L44 -2 C14 4 -14 4 -44 -2 Z"/>
      <path fill="${K.FLOSS}" stroke-width="4" d="M-43 -4 L-38 -18 C-14 -13 14 -13 40 -18 L44 -4 C14 1 -14 1 -43 -4 Z"/>
      <path fill="${GLOW}" stroke-width="3" d="M0 -37 L4 -28 L13 -27 L6 -21 L8 -12 L0 -17 L-8 -12 L-6 -21 L-13 -27 L-4 -28 Z" transform="translate(0 -14) scale(.62)"/>
    </g>`;

  // Candy corn, bottom centre at 0,0. Bands are clipped to the kernel, then outlined.
  const KERNEL = 'M0 -40 C7 -40 22 -12 23 -4 C24 2 18 5 0 5 C-18 5 -24 2 -23 -4 C-22 -12 -7 -40 0 -40Z';
  const bug = i => `
    <g id="bug${i}" visibility="hidden">
      <g class="legs" stroke="${INK}" stroke-width="3.5" stroke-linecap="round" fill="none">
        <path d="M-15 1 L-21 8"/><path d="M-6 3 L-8 10"/><path d="M6 3 L8 10"/><path d="M15 1 L21 8"/>
      </g>
      <g clip-path="url(#kernel)">
        <rect x="-26" y="-42" width="52" height="15" fill="${ENAMEL}"/>
        <rect x="-26" y="-27" width="52" height="15" fill="#F7882F"/>
        <rect x="-26" y="-12" width="52" height="19" fill="${GLOW}"/>
      </g>
      <path d="${KERNEL}" fill="none" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>
      <g class="mean" fill="none" stroke="${INK}" stroke-linecap="round">
        <circle cx="-6" cy="-19" r="2.8" fill="${INK}" stroke="none"/><circle cx="6" cy="-19" r="2.8" fill="${INK}" stroke="none"/>
        <path d="M-11 -26 L-3 -23 M11 -26 L3 -23" stroke-width="2.6"/>
        <path d="M-6 -10 Q0 -5 6 -10" stroke-width="2.6"/>
      </g>
      <g class="yikes" fill="none" stroke="${INK}" stroke-linecap="round" visibility="hidden">
        <path d="M-9 -22 L-3 -16 M-3 -22 L-9 -16 M3 -22 L9 -16 M9 -22 L3 -16" stroke-width="2.4"/>
        <ellipse cx="0" cy="-8" rx="3.2" ry="4" fill="${INK}" stroke="none"/>
      </g>
    </g>`;

  // Jack-o'-lantern, bottom centre at 0,0. Far lobes one tone darker, like the tooth's far limbs.
  const lantern = (id, glowId) => `
    <g id="${id}" stroke="${INK}" stroke-width="6" stroke-linejoin="round">
      <ellipse cx="-36" cy="-47" rx="46" ry="46" fill="${PUMPKIN_FAR}"/>
      <ellipse cx="36" cy="-47" rx="46" ry="46" fill="${PUMPKIN_FAR}"/>
      <ellipse cx="0" cy="-50" rx="44" ry="51" fill="${PUMPKIN}"/>
      <g class="lid">
        <path fill="#6E8B3D" stroke-width="5" d="M-7 -98 C-8 -110 -3 -120 8 -124 L14 -117 C7 -113 6 -105 7 -98 Z"/>
        <path fill="none" stroke-width="3.5" stroke-linecap="round" d="M-30 -86 L-18 -80 L-6 -88 L6 -80 L18 -88 L30 -82"/>
      </g>
      <g id="${glowId}" fill="${GLOW}" stroke-width="4.5">
        <path d="M-36 -62 L-14 -62 L-25 -80 Z"/><path d="M14 -62 L36 -62 L25 -80 Z"/>
        <path d="M-5 -48 L5 -48 L0 -56 Z"/>
        <path d="M-36 -40 L-26 -33 L-18 -40 L-8 -32 L0 -40 L8 -32 L18 -40 L26 -33 L36 -40 C30 -14 -30 -14 -36 -40 Z"/>
      </g>
    </g>`;

  const bat = id => `
    <g id="${id}" class="bat" fill="${INK}">
      <path class="wing" d="M0 0 C-8 -9 -20 -10 -30 -4 C-24 -2 -22 3 -18 6 C-13 2 -7 2 0 4 Z M0 0 C8 -9 20 -10 30 -4 C24 -2 22 3 18 6 C13 2 7 2 0 4 Z"/>
      <ellipse cx="0" cy="1" rx="5" ry="6"/>
      <path d="M-4 -4 L-3 -9 L-1 -5 Z M4 -4 L3 -9 L1 -5 Z"/>
    </g>`;

  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <defs>
      <path id="sparkle" d="${K.SPARKLE}"/>
      <clipPath id="kernel" clipPathUnits="userSpaceOnUse"><path d="${KERNEL}"/></clipPath>
    </defs>
    <g class="scenery">
      <rect id="flash" x="-80" y="-80" width="560" height="420" fill="${ENAMEL}" opacity="0"/>
      <circle cx="44" cy="30" r="40" fill="#FFF1B8"/>
      <g fill="#F2E2A0"><circle cx="30" cy="20" r="7"/><circle cx="58" cy="42" r="5"/><circle cx="34" cy="48" r="4"/></g>
      <g id="stars" fill="${ENAMEL}">
        <use href="#sparkle" id="st1"/><use href="#sparkle" id="st2"/><use href="#sparkle" id="st3"/><use href="#sparkle" id="st4"/>
      </g>
      <path d="M-80 300 C10 236 120 246 200 268 C280 238 380 222 480 254 L480 340 L-80 340 Z" fill="#3A2459"/>
      <g fill="none" stroke="#2A1A42" stroke-width="9" stroke-linecap="round">
        <path d="M-30 300 C-28 270 -32 240 -26 206"/>
        <path d="M-27 240 C-14 230 -4 230 4 218 M-28 222 C-40 214 -46 200 -44 188 M-26 206 C-22 194 -14 188 -6 186"/>
      </g>
      <g fill="#5C4785" stroke="${INK}" stroke-width="4" stroke-linejoin="round">
        <path d="M44 300 L44 268 C44 252 76 252 76 268 L76 300 Z"/>
        <path d="M318 280 L318 254 C318 241 342 241 342 254 L342 280 Z"/>
      </g>
      <path d="M-80 ${GROUND} L480 ${GROUND} L480 520 L-80 520 Z" fill="#2B1D45" stroke="${INK}" stroke-width="6"/>
      <g transform="translate(16 ${GROUND + 8}) scale(.52)">${lantern('small', 'smallGlow')}</g>
    </g>
    ${bat('bat1')}${bat('bat2')}${bat('bat3')}
    <circle id="halo" cx="392" cy="286" r="104" fill="#FFB22E" opacity=".14"/>
    <ellipse cx="392" cy="${GROUND + 4}" rx="96" ry="9" fill="#000" opacity=".22"/>
    <g id="bigWrap">${lantern('big', 'bigGlow')}</g>
    <g id="peek" fill="${INK}" opacity="0"><ellipse cx="383" cy="302" rx="3.4" ry="4.6"/><ellipse cx="401" cy="302" rx="3.4" ry="4.6"/></g>
    <ellipse id="shadow" cx="202" cy="${GROUND - 2}" rx="86" ry="9" fill="#000" opacity=".22"/>
    ${K.strand('flossBack')}
    ${K.tooth(witchHat)}
    ${K.strand('flossFront')}
    ${bug(0)}${bug(1)}${bug(2)}
    <g fill="${ENAMEL}" stroke="${INK}" stroke-width="2.2">
      <use href="#sparkle" id="fx1"/><use href="#sparkle" id="fx2"/><use href="#sparkle" id="fx3"/><use href="#sparkle" id="fx4"/>
    </g>`;
  const $ = id => stage.querySelector('#' + id);
  const tooth = K.rig(stage);
  const shadow = $('shadow'), flossBack = $('flossBack'), flossFront = $('flossFront'), hat = $('hat');
  const big = $('big'), bigLid = big.querySelector('.lid'), bigGlow = $('bigGlow'), smallGlow = $('smallGlow');
  const halo = $('halo'), peek = $('peek'), flash = $('flash');
  const bugs = [0, 1, 2].map(i => {
    const g = $('bug' + i);
    return { g, legs: g.querySelector('.legs'), mean: g.querySelector('.mean'), yikes: g.querySelector('.yikes') };
  });
  const bats = ['bat1', 'bat2', 'bat3'].map(id => { const g = $(id); return { g, wing: g.querySelector('.wing') }; });
  const stars = ['st1', 'st2', 'st3', 'st4'].map($), fx = ['fx1', 'fx2', 'fx3', 'fx4'].map($);
  const STAR_AT = [[150, -20, 1.0], [262, 24, .8], [440, -28, 1.1], [110, 70, .7]];

  // Each bug: where it waits in line (x), and when it moves up a place.
  const LINE = [
    [[0, CONTACT]],
    [[0, 386], [4.1, 386], [4.6, CONTACT]],
    [[0, 424], [4.2, 424], [4.6, 386], [5.1, 386], [5.6, CONTACT]]
  ];

  function placeBug(i, t) {
    const b = bugs[i], p0 = POP[i], h = HIT[i];
    if (t < p0 || t > h + 1.1) { b.g.setAttribute('visibility', 'hidden'); return; }
    b.g.setAttribute('visibility', 'visible');
    let x, y, rot = 0, s = 1, sx = 1, sy = 1, scared = false, walk = 0;
    if (t < p0 + .34) {                                        // hop out of the mouth
      const p = seg(t, p0, p0 + .34);
      x = lerp(MOUTH[0], LINE[i][0][1], p); y = lerp(MOUTH[1], GROUND, eIn(p)) - 64 * Math.sin(Math.PI * p);
      s = lerp(.35, 1, clamp(p * 1.6)); rot = -200 * (1 - p);
    } else if (t < h) {                                        // land, then shuffle up the line
      x = kf(t, LINE[i]); y = GROUND;
      const land = bump(t, p0 + .34, p0 + .5);
      sx = 1 + .18 * land; sy = 1 - .2 * land;
      const prev = kf(t - .02, LINE[i]); walk = Math.abs(prev - x) > .05 ? 1 : 0;
      y -= walk * 3 * Math.abs(Math.sin(t * 22));
      rot = walk * 6 * Math.sin(t * 22) + (1 - walk) * 3 * Math.sin(t * 5 + i);
    } else {                                                   // booted out of the patch
      const k = t - h;
      x = CONTACT + 430 * k; y = GROUND - 560 * k + 520 * k * k; rot = 760 * k; scared = true;
    }
    b.g.setAttribute('transform', `translate(${x} ${y}) rotate(${rot} 0 -18) scale(${BUG * s * sx} ${BUG * s * sy})`);
    b.legs.setAttribute('transform', `skewX(${(walk ? 18 : 5) * Math.sin(t * (walk ? 22 : 9))})`);
    b.mean.setAttribute('visibility', scared ? 'hidden' : 'visible');
    b.yikes.setAttribute('visibility', scared ? 'visible' : 'hidden');
  }

  function render(t) {
    t = ((t % T) + T) % T;
    const at = (a, b) => t >= a && t < b ? 1 : 0;

    // ---- the floss dance: arms swing one way, hips the other, twice a second ----
    const amp = seg(t, 3.0, 3.2) * (1 - seg(t, 6.8, 7.0));
    const ph = TAU * (t - 3.0);
    const pn = Math.tanh(2.2 * Math.sin(ph)) / Math.tanh(2.2);         // +1 arms right, -1 arms left (hips right)
    const p = pn * amp;
    const groove = amp * (1 - Math.abs(Math.sin(ph)));

    // ---- body ----
    let x = -24 * p, y = -7 * groove, rot = 8 * p, sq = .035 * Math.abs(p);
    rot += (1 - amp) * 2 * Math.sin(t * 2.6) * (at(0, 1.45) + at(8.4, 10));
    const scare = bump(t, 1.45, 1.8);
    y -= 22 * scare; sq -= .1 * scare; sq += .12 * bump(t, 1.8, 2.0);
    const leap = bump(t, 7.08, 7.62);
    y -= 46 * Math.sin(Math.PI / 2 * leap); sq += .13 * bump(t, 6.92, 7.1) + .13 * bump(t, 7.6, 7.82) - .08 * leap;
    for (const h of HIT) { sq += .05 * bump(t, h - .05, h + .15); x += 10 * bump(t, h - .12, h + .12); }
    tooth.place({ x, y, rot, sx: 1 + sq * .7, sy: 1 - sq });

    // ---- arms ----
    let aL = 55 + 5 * Math.sin(t * 2.6), aR = 55 - 5 * Math.sin(t * 2.6);
    if (t >= 1.45 && t < 2.15) { aL = aR = kf(t, [[1.45, 55], [1.55, -38], [1.95, -30], [2.15, 40]]); }
    if (t >= 2.15 && t < 3.0) { aL = aR = kf(t, [[2.15, 40], [2.45, 28], [3.0, 28]]); }
    if (t >= 3.0 && t < 7.0) {
      const into = eIO(seg(t, 3.0, 3.2));
      aR = lerp(28, 90 - 46 * pn, into); aL = lerp(28, 90 + 46 * pn, into);
      if (t >= 6.8) { aL = aR = lerp(aL, -50, seg(t, 6.8, 7.0)); }
    }
    if (t >= 7.0 && t < 8.4) { aL = -50 + 9 * Math.sin(t * 16); aR = -50 - 9 * Math.sin(t * 16); }
    if (t >= 8.4) {
      aL = kf(t, [[8.4, -50], [8.75, 55]]);
      aR = kf(t, [[8.4, -50], [8.7, -64], [9.25, -64], [9.65, 55]]);
    }
    const hand = tooth.arms(aL, aR);

    // ---- floss: pulled out in front, then swung behind the back and between the roots ----
    if (t >= 2.25 && t < 3.0) {
      const reach = eOut(seg(t, 2.25, 2.5)), twang = 9 * Math.sin((t - 2.5) * 40) * Math.exp(-(t - 2.5) * 7) * (t > 2.5 ? 1 : 0);
      const ex = lerp(hand.R[0], hand.L[0], reach), ey = lerp(hand.R[1], hand.L[1], reach);
      K.setD(flossFront, `M${hand.R[0]} ${hand.R[1]} Q${(hand.R[0] + ex) / 2} ${(hand.R[1] + ey) / 2 + 6 + twang} ${ex} ${ey}`);
      flossFront.setAttribute('visibility', 'visible');
    } else flossFront.setAttribute('visibility', 'hidden');
    if (t >= 3.0 && t < 6.9) {
      const c = tooth.toWorld([202 - 26 * p, 350]);
      K.setD(flossBack, `M${hand.L[0]} ${hand.L[1]} Q${c[0]} ${c[1]} ${hand.R[0]} ${hand.R[1]}`);
      flossBack.setAttribute('visibility', 'visible');
    } else flossBack.setAttribute('visibility', 'hidden');

    // ---- witch hat: jumps off the crown in the scare, tipped at the end ----
    const hop = bump(t, 1.45, 1.95), tip = bump(t, 8.6, 9.6);
    hat.setAttribute('transform', `translate(${6 * tip} ${-26 * Math.sin(Math.PI / 2 * hop) - 16 * tip}) rotate(${10 * hop + 13 * tip} 202 92)`);

    // ---- shadow ----
    const lift = Math.max(0, -y);
    shadow.setAttribute('cx', 202 + x + 14 * p);
    shadow.setAttribute('rx', 86 * (1 - lift / 220));
    shadow.setAttribute('opacity', .22 * (1 - lift / 160));

    // ---- face ----
    const gasp = at(1.45, 2.2), aim = at(2.2, 3.0), joy = at(7.0, 8.4);
    let whee = 0;
    for (const h of HIT) whee = Math.max(whee, at(h - .02, h + .38));
    let blink = 0;
    for (const b of [0.65, 3.35, 6.25, 9.2]) blink = Math.max(blink, bump(t, b, b + .14));
    const busy = gasp || aim || joy || whee;
    tooth.face({
      ey: -3 * aim + (gasp ? -2 : 0), blink: busy ? 0 : blink,
      big: gasp, o: gasp, focus: aim, flat: aim,
      arcs: joy || whee ? 1 : 0, open: joy || whee ? 1 : 0,
      smile: busy ? 0 : 1,
      blush: joy || whee ? 1 : at(3.0, 7.0) ? .8 : .5 * (at(0, 1.45) + at(8.4, 10)),
      sweat: at(1.55, 2.15)
    });

    // ---- the jack-o'-lanterns: flicker, burp out bugs, and bounce to the beat ----
    const flick = .5 + .25 * Math.sin(t * 23) + .25 * Math.sin(t * 37 + 1);
    const hot = Math.max(joy * (1 - seg(t, 8.0, 8.4)), ...POP.map(q => bump(t, q - .05, q + .25)));
    const glow = hot > .5 ? GLOW_HOT : GLOW;
    bigGlow.setAttribute('fill', glow); smallGlow.setAttribute('fill', glow);
    bigGlow.setAttribute('opacity', .78 + .22 * flick); smallGlow.setAttribute('opacity', .7 + .3 * (1 - flick));
    halo.setAttribute('opacity', .08 + .05 * flick + .1 * hot);
    halo.setAttribute('r', 100 + 8 * flick + 14 * hot);
    let burp = 0;
    for (const q of POP) burp = Math.max(burp, bump(t, q - .08, q + .16));
    burp = Math.max(burp, .5 * bump(t, 9.45, 9.65));
    bigLid.setAttribute('transform', `translate(0 ${-14 * burp}) rotate(${-8 * burp})`);
    const pq = amp * Math.abs(Math.sin(ph)) * .05 + .1 * burp - .06 * bump(t, 7.6, 7.85);
    big.setAttribute('transform', `translate(392 ${GROUND + 2}) scale(${1 + pq * .6} ${1 - pq})`);
    peek.setAttribute('opacity', seg(t, 9.3, 9.4) * (1 - bump(t, 9.7, 9.8)) * (1 - seg(t, 9.92, 10)));

    // ---- sugar bugs ----
    for (let i = 0; i < 3; i++) placeBug(i, t);

    // ---- sky: one flash of lightning in the scare, twinkling stars, bats over the moon ----
    flash.setAttribute('opacity', .32 * bump(t, 1.42, 1.56) + .14 * bump(t, 1.62, 1.72));
    STAR_AT.forEach(([sx, sy, sz], i) => {
      const tw = (t * .9 + i * .27) % 1;
      K.sparkle(stars[i], sx, sy, tw, i * 20, sz * .6);
    });
    const BATS = [[.1, 2.9, -40, 470, 90, 1], [7.15, 9.2, -60, 480, 40, .9], [7.45, 9.6, -30, 470, 74, .7]];
    BATS.forEach(([a, b, x0, x1, by, sc], i) => {
      const q = seg(t, a, b), on = q > 0 && q < 1;
      bats[i].g.setAttribute('visibility', on ? 'visible' : 'hidden');
      if (!on) return;
      const bx = lerp(x0, x1, q), byy = by - 50 * Math.sin(Math.PI * q) + 8 * Math.sin(t * 9 + i);
      bats[i].g.setAttribute('transform', `translate(${bx} ${byy}) scale(${sc})`);
      bats[i].wing.setAttribute('transform', `scale(1 ${Math.cos(t * 28 + i * 2)})`);
    });

    // ---- sparkles: a pop on every boot, a ring of them on the big leap ----
    HIT.forEach((h, i) => K.sparkle(fx[i], CONTACT - 6 + 10 * i, GROUND - 34 - 12 * i, seg(t, h - .02, h + .5), 15 * i, 1.4));
    const sp = seg(t, 7.2, 7.9);
    K.sparkle(fx[3], 202 + x, 30 + y * .4, sp, 0, 2.2);
  }

  // ---- sound: an optional spooky-funk loop at 120 bpm, scheduled against the animation clock ----
  let audio = null, soundOn = false, lastStep = -1;
  const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
  function voice(type, freq, at, dur, gain, glideTo) {
    const o = audio.ctx.createOscillator(), g = audio.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, at);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, at + dur);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + .01);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g).connect(audio.out); o.start(at); o.stop(at + dur + .05);
    return o;
  }
  function noise(at, dur, gain, hp) {
    const src = audio.ctx.createBufferSource(), f = audio.ctx.createBiquadFilter(), g = audio.ctx.createGain();
    src.buffer = audio.noise; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    src.connect(f).connect(g).connect(audio.out); src.start(at); src.stop(at + dur + .02);
  }
  function kick(at) { voice('sine', 150, at, .22, .9, 42); }
  function bass(n, at) {
    const o = audio.ctx.createOscillator(), f = audio.ctx.createBiquadFilter(), g = audio.ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = NOTE(n);
    f.type = 'lowpass'; f.frequency.setValueAtTime(900, at); f.frequency.exponentialRampToValueAtTime(220, at + .2); f.Q.value = 6;
    g.gain.setValueAtTime(.32, at); g.gain.exponentialRampToValueAtTime(0.0001, at + .22);
    o.connect(f).connect(g).connect(audio.out); o.start(at); o.stop(at + .25);
  }
  function theremin(at) {
    const o = voice('sine', 1046, at, 1.1, .22, 262), lfo = audio.ctx.createOscillator(), lg = audio.ctx.createGain();
    lfo.frequency.value = 6.5; lg.gain.value = 18; lfo.connect(lg).connect(o.frequency); lfo.start(at); lfo.stop(at + 1.15);
  }
  const ARP = [76, 79, 83, 87, 83, 79];            // E minor with a creepy major seventh
  const LINE_NOTES = [40, 40, 43, 40, 45, 46, 47, 50];
  function step(s, at) {                           // s: eighth note in the loop, 0..39
    const tl = s * .25;
    if (tl < 3 || tl >= 7.5) {
      voice('triangle', NOTE(ARP[s % ARP.length]), at, .5, tl >= 7.5 ? .08 : .1);
      if (s === 0 || s === 32) voice('sine', NOTE(28), at, 1.6, .25);
    }
    if (s === 6) { theremin(at); voice('square', NOTE(39), at, .5, .12, NOTE(27)); }
    if (tl >= 3 && tl < 7) {
      if (s % 2 === 0) kick(at);
      if (s % 4 === 2) noise(at, .14, .4, 1400);
      noise(at + .125, .04, .14, 7000);
      bass(LINE_NOTES[(s - 12) % 8], at);
    }
    if (s === 15 || s === 19 || s === 23) voice('square', NOTE(64), at, .2, .1, NOTE(88));
    if (s === 28) { [52, 55, 59, 62, 66].forEach(n => voice('square', NOTE(n), at, .6, .06)); kick(at); noise(at, .3, .3, 2500); }
    if (s >= 29 && s <= 31) voice('sine', NOTE([88, 91, 95][s - 29]), at, .4, .12);
  }

  // ---- playback (the kit's loop, plus a clock the sound can follow) ----
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const REST = 7.7;
  let playing = !reduce, elapsed = reduce ? REST : 0, last = null;
  const toggle = document.getElementById('toggle'), restart = document.getElementById('restart'), soundBtn = document.getElementById('sound');
  window.renderAt = render;
  render(elapsed);
  function schedule() {
    if (!soundOn || !playing || !audio) return;
    const now = audio.ctx.currentTime;
    const first = Math.floor(elapsed / .25) + 1, lastNeeded = Math.floor((elapsed + .3) / .25);
    for (let k = Math.max(first, lastStep + 1); k <= lastNeeded; k++) {
      step(((k % 40) + 40) % 40, now + (k * .25 - elapsed));
      lastStep = k;
    }
  }
  function frame(now) {
    if (window.__manual) return;
    if (last !== null && playing) elapsed += Math.min(.1, (now - last) / 1000);
    last = now;
    render(elapsed);
    schedule();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (toggle) {
    toggle.textContent = playing ? 'Pause' : 'Play';
    toggle.addEventListener('click', () => { playing = !playing; toggle.textContent = playing ? 'Pause' : 'Play'; lastStep = Math.floor(elapsed / .25); });
  }
  if (restart) restart.addEventListener('click', () => { elapsed = 0; lastStep = -1; playing = true; if (toggle) toggle.textContent = 'Pause'; });
  if (soundBtn) soundBtn.addEventListener('click', () => {
    if (!audio) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) { soundBtn.textContent = 'No sound here'; soundBtn.disabled = true; return; }
      const ctx = new Ctx(), comp = ctx.createDynamicsCompressor(), out = ctx.createGain();
      out.gain.value = .55; out.connect(comp).connect(ctx.destination);
      const buf = ctx.createBuffer(1, ctx.sampleRate * .5, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      audio = { ctx, out, noise: buf };
    }
    soundOn = !soundOn;
    if (soundOn) { audio.ctx.resume(); lastStep = Math.floor(elapsed / .25); if (!playing) { playing = true; if (toggle) toggle.textContent = 'Pause'; } }
    else audio.ctx.suspend();
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.textContent = soundOn ? 'Sound on' : 'Sound';
  });
})();
</script>
</body>
